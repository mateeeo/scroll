<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed < 1MB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    .bar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 9; display: flex; justify-content: space-between; align-items: center; }
    .info { background: #111c; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
    .btn { padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
    .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .feed::-webkit-scrollbar { display: none; }
    .slide { height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; background: #000; }
    video { height: 100%; width: 100%; max-width: 480px; object-fit: cover; }
    .msg { height: 100vh; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="info" id="info">0/10 • 0 KB</div>
    <div>
      <button class="btn" style="background:#333;color:#fff" onclick="location.hash='';location.reload()">Limpar</button>
      <button class="btn" style="background:#25d366;color:#000" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copiado!'">Copiar</button>
      <label class="btn" style="background:#fe2c55;color:#fff">+ Vídeos<input type="file" id="in" accept="video/*" multiple hidden></label>
    </div>
  </div>
  <div class="feed" id="feed"><div class="msg" id="msg">Suba até 10 vídeos (compressão automática < 1MB)</div></div>

  <script>
    let list = [];
    const obs = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target.querySelector('video');
      e.isIntersecting ? v.play().catch(()=>{}) : (v.pause(), v.currentTime = 0);
    }), { threshold: 0.6 });

    function compress(file) {
      return new Promise(res => {
        const v = document.createElement('video');
        v.src = URL.createObjectURL(file);
        v.muted = true;
        v.onloadedmetadata = () => {
          const c = document.createElement('canvas');
          c.height = 240;
          c.width = Math.round(240 * (v.videoWidth / v.videoHeight));
          const ctx = c.getContext('2d');
          const rec = new MediaRecorder(c.captureStream(15), { mimeType: 'video/webm', videoBitsPerSecond: 100000 });
          const chunks = [];
          rec.ondataavailable = e => chunks.push(e.data);
          rec.onstop = () => {
            const r = new FileReader();
            r.onloadend = () => res(r.result.split(',').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''));
            r.readAsDataURL(new Blob(chunks, { type: 'video/webm' }));
          };
          v.play(); rec.start();
          (function draw() {
            if (v.paused || v.ended || v.currentTime >= 4) return rec.state !== 'inactive' && rec.stop();
            ctx.drawImage(v, 0, 0, c.width, c.height);
            requestAnimationFrame(draw);
          })();
        };
      });
    }

    function addSlide(b64) {
      document.getElementById('msg')?.remove();
      const s = document.createElement('div');
      s.className = 'slide';
      const v = document.createElement('video');
      v.src = 'data:video/webm;base64,' + b64.replace(/-/g,'+').replace(/_/g,'/');
      v.loop = v.muted = v.playsInline = true;
      v.onclick = () => v.muted = !v.muted;
      s.appendChild(v);
      document.getElementById('feed').appendChild(s);
      obs.observe(s);
    }

    function update() {
      if (list.length) location.hash = list.join('|');
      document.getElementById('info').textContent = `${list.length}/10 • ${Math.round(location.href.length/1024)} KB`;
    }

    document.getElementById('in').onchange = async e => {
      document.getElementById('info').textContent = 'A comprimir...';
      for (const f of Array.from(e.target.files).slice(0, 10 - list.length)) {
        const b64 = await compress(f);
        list.push(b64);
        addSlide(b64);
      }
      update();
    };

    if (location.hash.length > 1) {
      list = location.hash.slice(1).split('|');
      list.forEach(addSlide);
      update();
    }
  </script>
</body>
</html>
