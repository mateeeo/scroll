<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Feed PC < 1MB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    .bar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 9; display: flex; justify-content: space-between; align-items: center; }
    .info { background: #111c; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
    .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; }
    .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    .feed::-webkit-scrollbar { display: none; }
    .slide { height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
    canvas { height: 100%; width: 100%; max-width: 480px; object-fit: cover; cursor: pointer; background: #111; }
    .msg { height: 100vh; display: flex; align-items: center; justify-content: center; color: #888; font-size: 15px; }
    .nav { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 9; }
    .nav button { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.18); color: #fff; border: none; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="info" id="info">0/10 • 0 KB</div>
    <div>
      <button class="btn" style="background:#333;color:#fff" onclick="history.replaceState(null,'',location.pathname);location.reload()">Limpar</button>
      <button class="btn" style="background:#25d366;color:#000" id="copyBtn">Copiar Link</button>
      <label class="btn" style="background:#fe2c55;color:#fff">+ Subir Vídeos<input type="file" id="in" accept="video/*" multiple hidden></label>
    </div>
  </div>

  <div class="nav">
    <button onclick="scrollFeed(-1)">↑</button>
    <button onclick="scrollFeed(1)">↓</button>
  </div>

  <div class="feed" id="feed"><div class="msg" id="msg">Selecione até 10 vídeos no PC (< 1MB)</div></div>

  <script>
    let list = [];
    let fullLink = location.origin + location.pathname;
    const feed = document.getElementById('feed');

    function scrollFeed(dir) {
      feed.scrollBy({ top: dir * window.innerHeight, behavior: 'smooth' });
    }
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') scrollFeed(1);
      if (e.key === 'ArrowUp') scrollFeed(-1);
    });

    const obs = new IntersectionObserver(es => es.forEach(e => {
      e.target.dataset.visible = e.isIntersecting ? '1' : '0';
    }), { threshold: 0.6 });

    function extractFrames(file) {
      return new Promise(res => {
        const v = document.createElement('video');
        v.muted = true;
        v.src = URL.createObjectURL(file);

        v.onloadeddata = async () => {
          const c = document.createElement('canvas');
          c.height = 200;
          c.width = Math.round(200 * (v.videoWidth / v.videoHeight)) || 112;
          const ctx = c.getContext('2d');
          
          const frames = [];
          const total = 14;
          const step = Math.min(v.duration || 2, 4) / total;

          for (let i = 0; i < total; i++) {
            v.currentTime = i * step + 0.01;
            await new Promise(r => {
              const t = setTimeout(r, 100);
              v.onseeked = () => { clearTimeout(t); r(); };
            });
            ctx.drawImage(v, 0, 0, c.width, c.height);
            const dataUrl = c.toDataURL('image/jpeg', 0.45);
            const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
            if (b64.length > 50) frames.push(b64);
          }
          URL.revokeObjectURL(v.src);
          res(frames);
        };
        v.onerror = () => res([]);
      });
    }

    function addSlide(frames) {
      if (!frames || !frames.length) return;
      document.getElementById('msg')?.remove();

      const s = document.createElement('div');
      s.className = 'slide';
      s.dataset.visible = '1';
      const c = document.createElement('canvas');
      c.width = 112;
      c.height = 200;
      const ctx = c.getContext('2d');
      s.appendChild(c);
      feed.appendChild(s);
      obs.observe(s);

      const imgs = frames.map(b64 => {
        const img = new Image();
        img.src = 'data:image/jpeg;base64,' + b64.replace(/[^A-Za-z0-9+/=]/g, '');
        return img;
      });

      let idx = 0, paused = false;
      c.onclick = () => paused = !paused;

      setInterval(() => {
        if (paused || s.dataset.visible !== '1') return;
        const img = imgs.at(idx);
        if (!img || !img.complete || img.naturalWidth === 0) return;
        try {
          if (c.width !== img.naturalWidth) {
            c.width = img.naturalWidth;
            c.height = img.naturalHeight;
          }
          ctx.drawImage(img, 0, 0, c.width, c.height);
          idx = (idx + 1) % imgs.length;
        } catch (err) {}
      }, 125);
    }

    function update() {
      if (list.length) {
        const hash = '#v2=' + list.map(f => f.join('~')).join('|');
        fullLink = location.origin + location.pathname + hash;
        try { history.replaceState(null, '', hash); } catch (e) {}
      }
      document.getElementById('info').textContent = `${list.length}/10 • ${Math.round(fullLink.length / 1024)} KB`;
    }

    document.getElementById('in').onchange = async e => {
      const files = Array.from(e.target.files).slice(0, 10 - list.length);
      for (let i = 0; i < files.length; i++) {
        document.getElementById('info').textContent = `A processar ${i + 1}/${files.length}...`;
        const frames = await extractFrames(files.item(i));
        if (frames.length) { list.push(frames); addSlide(frames); }
      }
      update();
      e.target.value = '';
    };

    document.getElementById('copyBtn').onclick = function() {
      navigator.clipboard.writeText(fullLink);
      this.textContent = 'Link Copiado!';
      setTimeout(() => this.textContent = 'Copiar Link', 2000);
    };

    // Só carrega se for o novo formato #v2=, ignorando lixo antigo na URL
    if (location.hash.startsWith('#v2=')) {
      list = location.hash.slice(4).split('|').map(v => v.split('~'));
      list.forEach(addSlide);
      update();
    } else if (location.hash.length > 1) {
      history.replaceState(null, '', location.pathname);
    }
  </script>
</body>
</html>
